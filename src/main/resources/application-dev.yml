spring:
  application:
    name: school
  datasource:
    url: jdbc:postgresql://localhost:5432/school_db
    driver-class-name: org.postgresql.Driver
    username: admin
    password: admin123
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
  sql:
    init:
      mode: always
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.srs.school: INFO
    org.springframework.web: INFO

